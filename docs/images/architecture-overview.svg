<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Brazilian E-Commerce Data Quality Platform Architecture</title>
<desc id="desc">Event-driven S3, EventBridge, SQS and Lambda ingestion, schema evolution reporting, Glue ETL and Athena analytics.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101c36"/><stop offset="1" stop-color="#172b4d"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb15e"/><stop offset="1" stop-color="#f47721"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b69cff"/><stop offset="1" stop-color="#7c4dce"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ee6b6"/><stop offset="1" stop-color="#2d9c71"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#86d5ff"/><stop offset="1" stop-color="#328acb"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 z" fill="#a9bddb"/></marker>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#fff}.subtitle{font:16px Arial,sans-serif;fill:#b9c9df}
    .section{font:700 17px Arial,sans-serif;fill:#dbe8fb;letter-spacing:1.3px}
    .node{fill:#243b5c;stroke:#58708f;stroke-width:1.5}.nodeTitle{font:700 17px Arial,sans-serif;fill:#fff}.nodeSub{font:13px Arial,sans-serif;fill:#ccdaec}
    .tag{font:700 12px Arial,sans-serif;fill:#17243c}.foot{font:13px Arial,sans-serif;fill:#aabbd2}
    .line{stroke:#a9bddb;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1400" height="900" rx="28" fill="url(#bg)"/>
<text x="64" y="72" class="title">Brazilian E-Commerce · Data Quality Platform</text>
<text x="64" y="105" class="subtitle">Event-driven ingestion • schema evolution • direct-S3 ETL • analytics-ready data</text>

<rect x="48" y="145" width="1304" height="335" rx="20" fill="#1b2d49" stroke="#3d5678"/>
<text x="78" y="182" class="section">01 / EVENT-DRIVEN INGESTION</text>
<g>
 <rect x="80" y="220" width="170" height="112" rx="15" class="node"/><rect x="80" y="220" width="170" height="8" rx="4" fill="url(#orange)"/>
 <text x="165" y="270" text-anchor="middle" class="nodeTitle">Amazon S3</text><text x="165" y="297" text-anchor="middle" class="nodeSub">Raw data zone</text>
 <rect x="300" y="220" width="170" height="112" rx="15" class="node"/><rect x="300" y="220" width="170" height="8" rx="4" fill="url(#orange)"/>
 <text x="385" y="270" text-anchor="middle" class="nodeTitle">EventBridge</text><text x="385" y="297" text-anchor="middle" class="nodeSub">Object-created events</text>
 <rect x="520" y="220" width="170" height="112" rx="15" class="node"/><rect x="520" y="220" width="170" height="8" rx="4" fill="url(#orange)"/>
 <text x="605" y="270" text-anchor="middle" class="nodeTitle">Amazon SQS</text><text x="605" y="297" text-anchor="middle" class="nodeSub">Ingestion queue + DLQ</text>
 <rect x="740" y="220" width="190" height="112" rx="15" class="node"/><rect x="740" y="220" width="190" height="8" rx="4" fill="url(#purple)"/>
 <text x="835" y="270" text-anchor="middle" class="nodeTitle">AWS Lambda</text><text x="835" y="297" text-anchor="middle" class="nodeSub">Python JSON validation</text>
 <rect x="1000" y="205" width="290" height="58" rx="12" class="node"/><rect x="1000" y="205" width="8" height="58" rx="4" fill="url(#green)"/>
 <text x="1145" y="240" text-anchor="middle" class="nodeTitle">S3 · Validated zone</text>
 <rect x="1000" y="290" width="290" height="58" rx="12" class="node"/><rect x="1000" y="290" width="8" height="58" rx="4" fill="#ed7777"/>
 <text x="1145" y="325" text-anchor="middle" class="nodeTitle">S3 · Quarantine zone</text>
 <path d="M250 276 H292" class="line"/><path d="M470 276 H512" class="line"/><path d="M690 276 H732" class="line"/>
 <path d="M930 260 C960 260 960 234 992 234" class="line"/><path d="M930 292 C960 292 960 319 992 319" class="line"/>
 <text x="1145" y="384" text-anchor="middle" class="nodeSub">Valid records / rejected records + errors</text>
 <rect x="520" y="380" width="410" height="55" rx="12" fill="#2d3b55" stroke="#e2a34a" stroke-dasharray="5 4"/>
 <text x="725" y="413" text-anchor="middle" class="nodeSub">Retries exhausted → Dead-letter queue</text>
</g>

<rect x="48" y="505" width="620" height="315" rx="20" fill="#1b2d49" stroke="#3d5678"/>
<text x="78" y="542" class="section">02 / SCHEMA EVOLUTION</text>
<rect x="82" y="585" width="215" height="105" rx="14" class="node"/><rect x="82" y="585" width="215" height="8" rx="4" fill="url(#purple)"/>
<text x="189" y="630" text-anchor="middle" class="nodeTitle">S3 Schema versions</text><text x="189" y="657" text-anchor="middle" class="nodeSub">JSON Schema v1 / v2 / v3</text>
<rect x="370" y="585" width="245" height="105" rx="14" class="node"/><rect x="370" y="585" width="245" height="8" rx="4" fill="url(#purple)"/>
<text x="492" y="630" text-anchor="middle" class="nodeTitle">Python comparison engine</text><text x="492" y="657" text-anchor="middle" class="nodeSub">Breaking / review / compatible</text>
<path d="M297 638 H362" class="line"/>
<rect x="180" y="725" width="340" height="60" rx="12" fill="#2d3b55" stroke="#8d70d8"/>
<text x="350" y="761" text-anchor="middle" class="nodeTitle">S3 · Compatibility reports</text>
<path d="M492 690 V716" class="line"/>

<rect x="700" y="505" width="652" height="315" rx="20" fill="#1b2d49" stroke="#3d5678"/>
<text x="730" y="542" class="section">03 / CURATION &amp; ANALYTICS</text>
<rect x="733" y="585" width="180" height="105" rx="14" class="node"/><rect x="733" y="585" width="180" height="8" rx="4" fill="url(#green)"/>
<text x="823" y="630" text-anchor="middle" class="nodeTitle">Validated S3</text><text x="823" y="657" text-anchor="middle" class="nodeSub">JSON input prefix</text>
<rect x="955" y="585" width="180" height="105" rx="14" class="node"/><rect x="955" y="585" width="180" height="8" rx="4" fill="url(#purple)"/>
<text x="1045" y="630" text-anchor="middle" class="nodeTitle">AWS Glue ETL</text><text x="1045" y="657" text-anchor="middle" class="nodeSub">PySpark transforms</text>
<rect x="1170" y="585" width="150" height="105" rx="14" class="node"/><rect x="1170" y="585" width="150" height="8" rx="4" fill="url(#green)"/>
<text x="1245" y="630" text-anchor="middle" class="nodeTitle">S3 Curated</text><text x="1245" y="657" text-anchor="middle" class="nodeSub">Parquet</text>
<path d="M913 638 H947" class="line"/><path d="M1135 638 H1162" class="line"/>
<rect x="905" y="725" width="315" height="60" rx="12" fill="#2d3b55" stroke="#4c9bcf"/>
<text x="1062" y="761" text-anchor="middle" class="nodeTitle">Amazon Athena · SQL analytics</text>
<path d="M1245 690 C1245 710 1225 755 1228 755" class="line"/>
<text x="64" y="864" class="foot">Optional Glue Crawler is a separate branch; direct-S3 ETL and Athena DDL do not depend on it.</text>
</svg>