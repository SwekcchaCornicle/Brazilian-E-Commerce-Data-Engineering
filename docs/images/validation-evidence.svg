<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Observed Lambda validation evidence</title><desc id="desc">Two one-record valid JSON fixture runs with one valid record and zero invalid records each, as observed in CloudWatch during development.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c32"/><stop offset="1" stop-color="#1a3453"/></linearGradient>
 <style>
 .h{font:700 28px Arial;fill:#fff}.sub{font:14px Arial;fill:#b9cbe0}.mono{font:16px Consolas,monospace;fill:#dce9f6}.label{font:700 13px Arial;fill:#b9cbe0;letter-spacing:1px}.green{font:700 20px Arial;fill:#7be0aa}.card{fill:#213a5a;stroke:#4d6c90;stroke-width:1.5}
 </style>
</defs>
<rect width="1200" height="520" rx="24" fill="url(#bg)"/>
<text x="55" y="65" class="h">Lambda validation · observed development runs</text>
<text x="55" y="95" class="sub">One-record JSON test fixtures • CloudWatch log counts reported during implementation</text>
<rect x="55" y="135" width="520" height="260" rx="16" class="card"/>
<text x="85" y="180" class="label">RUN 01 · test.json</text>
<text x="85" y="230" class="mono">total_records:   1</text>
<text x="85" y="270" class="mono">valid_records:   1</text>
<text x="85" y="310" class="mono">invalid_records: 0</text>
<text x="85" y="365" class="green">✓ Validated output observed</text>
<rect x="625" y="135" width="520" height="260" rx="16" class="card"/>
<text x="655" y="180" class="label">RUN 02 · valid_customer.json</text>
<text x="655" y="230" class="mono">total_records:   1</text>
<text x="655" y="270" class="mono">valid_records:   1</text>
<text x="655" y="310" class="mono">invalid_records: 0</text>
<text x="655" y="365" class="green">✓ Validated output observed</text>
<text x="55" y="450" class="sub">These are observed test-fixture log counts, not aggregate Kaggle dataset statistics. Invalid/quarantine routing should be verified separately.</text>
</svg>